<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><rect width="900" height="320" fill="white"/><text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">PMF and PDF show probability differently</text><g transform="translate(30,48)"><text x="200" y="20" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">PMF: discrete values</text><path d="M35 220H390M45 220V35" stroke="#333" stroke-width="2"/><g stroke="#3978ac" stroke-width="9"><path d="M100 220V175M165 220V105M230 220V70M295 220V105M360 220V175"/></g><text x="215" y="255" text-anchor="middle" font-family="Arial" font-size="14">Possible values</text></g><g transform="translate(480,48)"><text x="200" y="20" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">PDF: continuous values</text><path d="M35 220H390M45 220V35" stroke="#333" stroke-width="2"/><path d="M55 215 C105 210 135 165 170 100 C200 45 235 45 265 100 C300 165 330 210 380 215" fill="none" stroke="#e07b53" stroke-width="4"/><text x="215" y="255" text-anchor="middle" font-family="Arial" font-size="14">Measured values</text></g></svg>