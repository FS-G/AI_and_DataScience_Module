  <g stroke="#8796a5" stroke-width="1.5"><path d="M100 88H660M100 140H660M100 184H660M100 228H660M100 272H660M100 316H660M100 88V316M280 88V316M435 88V316M545 88V316M660 88V316"/></g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#243447" text-anchor="middle">
    <text x="190" y="120" font-weight="bold">Confidence</text><text x="357" y="120" font-weight="bold">α total</text><text x="490" y="120" font-weight="bold">α/2 each tail</text><text x="602" y="120" font-weight="bold">z*</text>
    <text x="190" y="169">80%</text><text x="357" y="169">20%</text><text x="490" y="169">10%</text><text x="602" y="169">1.282</text>
    <text x="190" y="213">90%</text><text x="357" y="213">10%</text><text x="490" y="213">5%</text><text x="602" y="213">1.645</text>
    <text x="190" y="257" font-weight="bold">95%</text><text x="357" y="257" font-weight="bold">5%</text><text x="490" y="257" font-weight="bold">2.5%</text><text x="602" y="257" font-weight="bold">1.960</text>
    <text x="190" y="301">99%</text><text x="357" y="301">1%</text><text x="490" y="301">0.5%</text><text x="602" y="301">2.576</text>
